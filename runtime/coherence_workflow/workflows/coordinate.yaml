# Opt-in bounded task/repair/review graph. No runtime model escalation.
schema_version: 1
workflow_id: coordinate
registry_version: '1'
start: intake
nodes:
- id: intake
  handler: intake
  handler_version: '1'
  type: code
  outcomes:
  - ok
  transitions:
    ok: authority
  side_effects:
  - read
  max_retries: 0
- id: authority
  handler: authority
  handler_version: '1'
  type: gate
  outcomes:
  - ok
  transitions:
    ok: custody
  side_effects:
  - read
  max_retries: 0
- id: custody
  handler: custody
  handler_version: '1'
  type: code
  outcomes:
  - ok
  transitions:
    ok: select
  side_effects:
  - read
  max_retries: 0
- id: select
  handler: select
  handler_version: '1'
  type: code
  outcomes:
  - work
  - done
  transitions:
    work: dispatch
    done: review
  side_effects:
  - read
  max_retries: 0
- id: dispatch
  handler: dispatch
  handler_version: '1'
  type: code
  outcomes:
  - implement
  - repair
  transitions:
    implement: implement
    repair: repair
  side_effects:
  - read
  max_retries: 0
- id: implement
  handler: implement
  handler_version: '1'
  type: agent
  outcomes:
  - ok
  - owner_input_required
  transitions:
    ok: verify
    owner_input_required: owner-input-implement
  side_effects:
  - files
  - process
  - conversation
  max_retries: 0
  role: implement
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: role_default
    min_free_tokens_before_compaction: 150000
    reuse_preference: same_group
  max_repair_attempts: 2
  tools:
  - read_file
  - write_file
  - request_owner_input
  permissions:
  - read_file
  - write_file
  - request_owner_input
- id: repair
  handler: repair
  handler_version: '1'
  type: agent
  outcomes:
  - ok
  - blocked
  - owner_input_required
  transitions:
    ok: verify
    blocked: failure
    owner_input_required: owner-input-repair
  side_effects:
  - files
  - process
  - conversation
  max_retries: 0
  role: repair
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: role_default
    min_free_tokens_before_compaction: 150000
    reuse_preference: original_implementer
  max_repair_attempts: 2
  tools:
  - read_file
  - write_file
  - request_owner_input
  permissions:
  - read_file
  - write_file
  - request_owner_input
- id: owner-input-implement
  handler: owner-input-implement
  handler_version: '1'
  type: gate
  outcomes: [ready]
  transitions:
    ready: continue-implement
  side_effects: []
  max_retries: 0
- id: owner-input-repair
  handler: owner-input-repair
  handler_version: '1'
  type: gate
  outcomes: [ready]
  transitions:
    ready: continue-repair
  side_effects: []
  max_retries: 0
- id: continue-implement
  handler: continue-implement
  handler_version: '1'
  type: agent
  outcomes: [ok, owner_input_required]
  transitions:
    ok: verify
    owner_input_required: owner-input-implement
  side_effects: [files, process, conversation]
  max_retries: 0
  role: implement
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: role_default
    min_free_tokens_before_compaction: 150000
    reuse_preference: same_group
  max_repair_attempts: 2
  tools: [read_file, write_file, request_owner_input]
  permissions: [read_file, write_file, request_owner_input]
- id: continue-repair
  handler: continue-repair
  handler_version: '1'
  type: agent
  outcomes: [ok, blocked, owner_input_required]
  transitions:
    ok: verify
    blocked: failure
    owner_input_required: owner-input-repair
  side_effects: [files, process, conversation]
  max_retries: 0
  role: repair
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: role_default
    min_free_tokens_before_compaction: 150000
    reuse_preference: original_implementer
  max_repair_attempts: 2
  tools: [read_file, write_file, request_owner_input]
  permissions: [read_file, write_file, request_owner_input]
- id: verify
  handler: verify
  handler_version: '1'
  type: code
  outcomes:
  - ok
  - repair
  - blocked
  transitions:
    ok: checkpoint
    repair: repair
    blocked: failure
  side_effects:
  - read
  - process
  max_retries: 0
- id: checkpoint
  handler: checkpoint
  handler_version: '1'
  type: code
  outcomes:
  - ok
  transitions:
    ok: select
  side_effects:
  - git
  - process
  max_retries: 0
- id: review
  handler: review
  handler_version: '1'
  type: agent
  outcomes:
  - ok
  - correction
  - blocked
  - owner_input_required
  transitions:
    ok: complete
    correction: authorize-correction
    blocked: failure
    owner_input_required: owner-input-review
  side_effects:
  - read
  max_retries: 0
  role: review
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: role_default
    min_free_tokens_before_compaction: 150000
    reuse_preference: own_reviewer
  max_repair_attempts: 2
  tools:
  - read_file
  - request_owner_input
  permissions:
  - read_file
  - request_owner_input
- id: owner-input-review
  handler: owner-input-review
  handler_version: '1'
  type: gate
  outcomes: [ready]
  transitions:
    ready: continue-review
  side_effects: []
  max_retries: 0
- id: continue-review
  handler: continue-review
  handler_version: '1'
  type: agent
  outcomes: [ok, correction, blocked, owner_input_required]
  transitions:
    ok: complete
    correction: authorize-correction
    blocked: failure
    owner_input_required: owner-input-review
  side_effects: [read]
  max_retries: 0
  role: review
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: role_default
    min_free_tokens_before_compaction: 150000
    reuse_preference: own_reviewer
  max_repair_attempts: 2
  tools: [read_file, request_owner_input]
  permissions: [read_file, request_owner_input]
- id: authorize-correction
  handler: authorize-correction
  handler_version: '1'
  type: code
  outcomes:
  - ok
  - blocked
  transitions:
    ok: select
    blocked: failure
  side_effects:
  - read
  max_retries: 0
- id: complete
  handler: complete
  handler_version: '1'
  type: terminal
  outcomes: []
  transitions: {}
  side_effects:
  - read
- id: failure
  handler: failure
  handler_version: '1'
  type: terminal
  outcomes: []
  transitions: {}
  side_effects:
  - read
profiles:
  sol-medium:
    provider: openai-codex
    model: gpt-6.1-sol
    effort: medium
    observer_id: codex-final-payload
    observer_version: '1'
skills:
  coordinate:
    path: skills/coordinate-implementation/SKILL.md
    sha256: b491941959062029db3d670bbf05dfd103c4e0d032763a3e61e45e401ae0c57a
    resource_hash: b491941959062029db3d670bbf05dfd103c4e0d032763a3e61e45e401ae0c57a
defaults:
  max_repair_attempts: 2
  min_free_tokens_before_compaction: 150000
  monitor_interval_ms: 1000
  telemetry_max_age_ms: 2000
storage:
  checkpoint: .coherence/workflow/workflow.sqlite
  event_root: .coherence/workflow/runs
permissions:
- read_file
- write_file
- request_owner_input
- workflow.FileBytes
- workflow.PythonAnswer
tool_capabilities:
- read_file
- write_file
- request_owner_input
containment_capability: linux-cgroup-v2
settings_manifest:
  path: runtime/coherence_workflow/schemas/workflow.schema.json
  sha256: 9bc47a1227f225d5928b80d0ac778171f5557da617a046119c4da8db7b096a78
interaction:
  mode: standalone
  question_transport: null
  parent_binding_ref: null
  question_tool: null
