# Opt-in standalone task-progress graph; final acceptance remains review-gated.
schema_version: 1
workflow_id: coordinate
registry_version: '1'
start: intake
nodes:
- id: intake
  handler: intake
  handler_version: '1'
  type: code
  outcomes:
  - ok
  transitions:
    ok: authority
  side_effects:
  - read
  max_retries: 0
- id: authority
  handler: authority
  handler_version: '1'
  type: gate
  outcomes:
  - ok
  transitions:
    ok: custody
  side_effects:
  - read
  max_retries: 0
- id: custody
  handler: custody
  handler_version: '1'
  type: code
  outcomes:
  - ok
  transitions:
    ok: select
  side_effects:
  - read
  max_retries: 0
- id: select
  handler: select
  handler_version: '1'
  type: code
  outcomes:
  - work
  - done
  transitions:
    work: implement
    done: review
  side_effects:
  - read
  max_retries: 0
- id: implement
  handler: implement
  handler_version: '1'
  type: agent
  outcomes:
  - ok
  transitions:
    ok: verify
  side_effects:
  - files
  - process
  - conversation
  max_retries: 0
  role: implement
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: fresh_only
    min_free_tokens_before_compaction: 150000
    reuse_preference: same_group
  max_repair_attempts: 2
  tools:
  - read_file
  - write_file
  permissions:
  - read_file
  - write_file
- id: verify
  handler: verify
  handler_version: '1'
  type: code
  outcomes:
  - ok
  transitions:
    ok: checkpoint
  side_effects:
  - read
  - process
  max_retries: 0
- id: checkpoint
  handler: checkpoint
  handler_version: '1'
  type: code
  outcomes:
  - ok
  transitions:
    ok: select
  side_effects:
  - git
  - process
  max_retries: 0
- id: review
  handler: review
  handler_version: '1'
  type: agent
  outcomes:
  - ok
  transitions:
    ok: complete
  side_effects:
  - read
  max_retries: 0
  role: review
  profile: sol-medium
  skill: coordinate
  session_policy:
    mode: fresh_only
    min_free_tokens_before_compaction: 150000
    reuse_preference: own_reviewer
  max_repair_attempts: 2
  tools:
  - read_file
  permissions:
  - read_file
- id: complete
  handler: complete
  handler_version: '1'
  type: terminal
  outcomes: []
  transitions: {}
  side_effects:
  - read
profiles:
  sol-medium:
    provider: openai-codex
    model: gpt-6.1-sol
    effort: medium
    observer_id: codex-final-payload
    observer_version: '1'
skills:
  coordinate:
    path: skills/coordinate-implementation/SKILL.md
    sha256: c22609ddd7b72ea0fe5407dd122585eb09f941e4008e59f942d690ecda0e7958
    resource_hash: c22609ddd7b72ea0fe5407dd122585eb09f941e4008e59f942d690ecda0e7958
