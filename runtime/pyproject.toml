[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-workflow"
version = "0.1.0"
description = "Sequential task execution with the Pi SDK and focused Git checkpoints"
requires-python = ">=3.10"
dependencies = [
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coherence_workflow*"]

[tool.setuptools.package-data]
coherence_workflow = ["schemas/*.json"]

[project.scripts]
coordinate-implementation = "coherence_workflow.cli:main"

[tool.setuptools.data-files]
"share/coherence-workflow/pi-host" = ["pi-host/host.mjs", "pi-host/package.json", "pi-host/package-lock.json"]
