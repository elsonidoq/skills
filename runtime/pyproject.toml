[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-workflow"
version = "0.1.0"
description = "Opt-in local durable workflow and tool custody substrate"
requires-python = ">=3.10"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coherence_workflow*"]

[tool.setuptools.package-data]
coherence_workflow = ["schemas/*.json", "workflows/*.yaml"]
