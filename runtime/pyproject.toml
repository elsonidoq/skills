[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-workflow"
version = "0.1.0"
description = "Sequential task execution with the Pi SDK and focused Git checkpoints"
requires-python = ">=3.10"
dependencies = [
  "PyYAML==6.0.3",
  "langgraph==1.2.21",
  "langgraph-checkpoint-sqlite==3.1.3",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coherence_workflow*"]

[tool.setuptools.package-data]
coherence_workflow = ["schemas/*.json"]

[project.scripts]
coordinate-implementation = "coherence_workflow.cli:main"

[tool.setuptools.data-files]
"share/coherence-workflow/pi-host" = ["pi-host/host.mjs", "pi-host/sdk.mjs", "pi-host/sdk-resolution.mjs", "pi-host/package.json", "pi-host/package-lock.json"]
