[project]
name = "workflow-monitor"
version = "0.1.0"
description = "Read-only snapshots for recorded Coherence workflow runs"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["workflow_monitor"]
package-dir = {workflow_monitor = "."}
