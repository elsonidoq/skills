[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-monitor"
version = "0.1.0"
description = "Read-only snapshots for recorded Coherence workflow runs"
requires-python = ">=3.10"
dependencies = ["starlette==0.46.2", "uvicorn==0.34.0"]

[project.scripts]
workflow-monitor = "workflow_monitor.__main__:main"
workflow-monitor-preserve = "workflow_monitor.preserve:main"

[tool.setuptools]
packages = ["workflow_monitor"]
package-dir = {workflow_monitor = "."}
